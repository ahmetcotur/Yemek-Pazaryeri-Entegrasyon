openapi: 3.1.0
info:
  title: Food Order API
  version: 0.2.0
  description: Self-hosted unified food order API with real adapters for Trendyol Go, Uber Eats, Yemeksepeti, GetirYemek and Migros Yemek.
servers:
  - url: http://127.0.0.1:3000
security:
  - Bearer: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Server health.
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Enabled providers, environments and supported capabilities.
        '401':
          description: Missing or invalid token.
  /v1/demo/orders:
    post:
      operationId: createDemoOrder
      responses:
        '201':
          description: Synthetic order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Missing or invalid token.
  /v1/orders/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    get:
      operationId: listOrders
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0, maximum: 999999 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Page of normalized orders.
          content:
            application/json:
              schema:
                type: object
                required: [data, page, size, has_more]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  page: { type: integer }
                  size: { type: integer }
                  has_more: { type: boolean }
        '400': { description: Invalid pagination. }
        '401': { description: Missing or invalid token. }
        '429': { description: Provider request limit reached. }
        '502': { description: Upstream failure. }
        '503': { description: Provider disabled. }
  /v1/orders/{provider}/{id}:
    parameters:
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getOrder
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { description: Missing or invalid token. }
        '404': { description: Order not found. }
        '429': { description: Provider request limit reached. }
        '502': { description: Upstream failure. }
        '503': { description: Provider disabled. }
  /v1/orders/{provider}/{id}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/Id'
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [accept, ready, dispatch, deliver, cancel] }
    post:
      operationId: advanceOrder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                preparationTime: { type: integer, description: Preparation time in minutes for accept action. }
                reasonId: { type: integer, description: Marketplace rejection reason ID. }
                itemIdList: { type: array, items: { type: string }, description: Line items to cancel for TGO. }
      responses:
        '200': { description: Order action processed successfully. }
        '401': { description: Missing or invalid token. }
        '404': { description: Order not found. }
        '409': { description: Action unavailable for the current status. }
        '502': { description: Upstream marketplace failure. }
        '503': { description: Provider disabled. }
  /v1/webhooks/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    post:
      operationId: ingestProviderWebhook
      security: []
      description: Ingest real-time order notifications directly from marketplaces (TGO, Yemeksepeti, Getir, Migros).
      responses:
        '200': { description: Order normalized and recorded successfully. }
        '400': { description: Invalid payload. }
        '502': { description: Provider payload normalization failure. }
        '503': { description: Provider disabled. }
webhooks:
  OrderEvent:
    post:
      operationId: receiveOrderEvent
      security: []
      parameters:
        - { name: X-Food-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Food-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Food-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, occurred_at, order]
              properties:
                id: { type: string }
                type: { type: string, enum: [order.created, order.status_changed] }
                occurred_at: { type: string, format: date-time }
                order: { $ref: '#/components/schemas/Order' }
      responses:
        '2XX': { description: Event recorded successfully. }
components:
  securitySchemes:
    Bearer: { type: http, scheme: bearer }
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [demo, tgo, yemeksepeti, getir, migros] }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Order:
      description: Normalized order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
  schemas:
    Order:
      type: object
      required: [id, channel, store_id, order_number, status, source_status, source_app, fulfillment, total_minor, currency, payment_method, items]
      properties:
        id: { type: string }
        channel:
          type: string
          enum: [demo, tgo, yemeksepeti, getir, migros]
          description: Connection adapter used to retrieve or execute the order.
        store_id: { type: string }
        order_number: { type: [string, 'null'] }
        status: { type: string, enum: [new, accepted, ready, out_for_delivery, delivered, cancelled, unknown] }
        source_status: { type: [string, 'null'] }
        source_app:
          type: [string, 'null']
          description: Original appName or source brand supplied by the marketplace.
        source_channel:
          type: string
          enum: [demo, trendyol, trendyol_go, getir_yemek, uber_eats, yemeksepeti, migros_yemek, unknown]
          description: Normalized ordering marketplace brand.
        source_label:
          type: [string, 'null']
          description: Display name of the ordering application. Null for an unrecognized source.
        fulfillment: { type: string, enum: [restaurant, platform, pickup, unknown] }
        total_minor: { type: [integer, 'null'] }
        currency: { type: string }
        payment_method: { type: [string, 'null'] }
        customer:
          type: [object, 'null']
          properties:
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            note: { type: [string, 'null'] }
        address:
          type: [object, 'null']
          properties:
            full_address: { type: [string, 'null'] }
            description: { type: [string, 'null'] }
            building_number: { type: [string, 'null'] }
            floor: { type: [string, 'null'] }
            door_number: { type: [string, 'null'] }
            district: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
        courier:
          type: [object, 'null']
          properties:
            model: { type: string, enum: [restaurant, platform, pickup] }
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            status: { type: [string, 'null'] }
            is_nearby: { type: boolean }
            eta_minutes: { type: [integer, 'null'] }
            estimated_pickup_time: { type: [string, 'null'] }
            tracking_url: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [name, quantity, cancelled_quantity, unit_price_minor]
            properties:
              name: { type: [string, 'null'] }
              quantity: { type: [integer, 'null'] }
              cancelled_quantity: { type: [integer, 'null'] }
              unit_price_minor: { type: [integer, 'null'] }
              note: { type: [string, 'null'] }
              options:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    price_minor: { type: integer }
              removed_ingredients:
                type: array
                items: { type: string }
